trigger:
  - main

pool: RohtasPool

stages:
- stage: TerraformPipeline
  displayName: 'Terraform Pipeline'
  jobs:
  - job: TerraformInstall
    displayName: 'Terraform Install'
    steps:
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 'latest'

  - job: TerraformInitPlanApply
    displayName: 'Init Plan Apply'
    dependsOn: TerraformInstall
    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/DEV'
        backendAzureRmUseEntraIdForAuthentication: false
        backendServiceArm: 'svc-connection-robinson15kumar'
        backendAzureRmResourceGroupName: 'rg-robinson'
        backendAzureRmStorageAccountName: 'robinteststorage3'
        backendAzureRmContainerName: 'mycontainer'
        backendAzureRmKey: 'prod.tfstate'

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/DEV'
        environmentServiceNameAzureRM: 'svc-connection-robinson15kumar'
  
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(System.DefaultWorkingDirectory)/DEV'
        environmentServiceNameAzureRM: 'svc-connection-robinson15kumar'
