# github action workflow for Docker build, push and Deploy to AKS

name: Build and Deploy Axionui to AKS

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ACR_NAME: nisargacr
  ACR_LOGIN_SERVER: nisargacr.azurecr.io
  IMAGE_NAME: axionui
  AKS_NAMESPACE: default

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.image-tag.outputs.tag }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Generate image tag
        id: image-tag
        run: echo "tag=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.tag }}

  deploy-to-aks:
    name: Deploy Axionui to AKS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Deploy Kubernetes manifests
        uses: azure/k8s-deploy@v5
        with:
          action: deploy
          manifests: |
            manifests/*.yaml
          images: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }}
          namespace: ${{ env.AKS_NAMESPACE }}

      - name: Logout from Azure
        if: always()
        run: az logout
